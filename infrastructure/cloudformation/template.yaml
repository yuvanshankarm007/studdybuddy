AWSTemplateFormatVersion: '2010-09-09'
Description: >
  StudyBuddy Infrastructure for Amazon Build Ship Shape 2026 (AWS Builder Mini-Challenge)
  Deploys DynamoDB (Single-Table + GSI1 + TTL), Lambda (MCP 2025-11-25 + EventBridge Handler),
  API Gateway V2, EventBridge Scheduled Rules, and CloudWatch Observability Dashboard.

Parameters:
  ProjectName:
    Type: String
    Default: StudyBuddy
    Description: Project name for resource naming

  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Amazon Bedrock model ID for coaching, safety verification, and pattern analysis

  DailyStudyCap:
    Type: Number
    Default: 240
    Description: Daily study cap in minutes (4 hours default)

Resources:
  # DynamoDB Table (Single-Table Design with GSI1 and TTL)
  StudyBuddyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}Data"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: Production

  # Least-Privilege Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}LambdaRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StudyBuddyLeastPrivilegePermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDBSingleTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt StudyBuddyTable.Arn
                  - !Sub "${StudyBuddyTable.Arn}/index/*"
              - Sid: BedrockModelAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/agents:*"
              - Sid: CloudWatchMetricsScopedNamespace
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Ref ProjectName

  # Lambda Function (Hosts MCP 2025-11-25 Server + EventBridge Proactive Dispatcher)
  MCPServerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-MCP-Server"
      Runtime: python3.12
      Handler: src.server.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          from src.server import lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref StudyBuddyTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DAILY_STUDY_CAP: !Ref DailyStudyCap
          ENABLE_CLOUDWATCH: "true"
      Timeout: 30
      MemorySize: 512
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # API Gateway V2 (HTTP API for Streamable HTTP MCP /mcp & REST)
  StudyBuddyAPI:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-API"
      ProtocolType: HTTP
      Target: !GetAtt MCPServerFunction.Arn
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        ExposeHeaders:
          - Mcp-Session-Id

  # Lambda Permission for API Gateway V2
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MCPServerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "${StudyBuddyAPI.Arn}/*"

  # CloudWatch Log Group
  StudyBuddyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${ProjectName}/agents"
      RetentionInDays: 30

  # CloudWatch Observability Dashboard
  StudyBuddyDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-Monitoring"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "Multi-Agent Latency (ms)",
                "metrics": [
                  ["StudyBuddy", "check_in_latency", {"stat": "Average"}],
                  ["StudyBuddy", "plan_creation_latency", {"stat": "Average"}],
                  ["StudyBuddy", "safety_check_latency", {"stat": "Average"}]
                ],
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 1000}}
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Agent Invocations & Safety Interventions",
                "metrics": [
                  ["StudyBuddy", "agent_calls", "Agent", "supervisor", {"stat": "Sum"}],
                  ["StudyBuddy", "agent_calls", "Agent", "planner", {"stat": "Sum"}],
                  ["StudyBuddy", "agent_calls", "Agent", "safety", {"stat": "Sum"}]
                ],
                "period": 300
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Student Engagement & Guardrail Events",
                "metrics": [
                  ["StudyBuddy", "user_engagement", "Event", "check_in", {"stat": "Sum"}],
                  ["StudyBuddy", "user_engagement", "Event", "session_complete", {"stat": "Sum"}],
                  ["StudyBuddy", "user_engagement", "Event", "override", {"stat": "Sum"}]
                ],
                "period": 3600
              }
            }
          ]
        }

  # EventBridge Rule 1: Evening Study Check-In Reminder (19:00 UTC)
  ProactiveCheckinScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-Evening-Checkin-Schedule"
      Description: "Trigger proactive study check-in reminder at 19:00"
      ScheduleExpression: "cron(0 19 * * ? *)"
      State: ENABLED
      Targets:
        - Id: ProactiveCheckinTarget
          Arn: !GetAtt MCPServerFunction.Arn
          Input: '{"source": "aws.events", "detail-type": "Scheduled Event", "detail": {"reminder_type": "checkin_reminder"}}'

  # EventBridge Rule 2: Wind-Down Sleep Cutoff Reminder (21:30 UTC)
  ProactiveSleepScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-Sleep-Cutoff-Schedule"
      Description: "Trigger wind-down reminder 30 minutes before 22:00 sleep cutoff"
      ScheduleExpression: "cron(30 21 * * ? *)"
      State: ENABLED
      Targets:
        - Id: ProactiveSleepTarget
          Arn: !GetAtt MCPServerFunction.Arn
          Input: '{"source": "aws.events", "detail-type": "Scheduled Event", "detail": {"reminder_type": "sleep_reminder"}}'

  # Lambda Permission for EventBridge Check-In Rule
  LambdaEventBridgeCheckinPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MCPServerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProactiveCheckinScheduleRule.Arn

  # Lambda Permission for EventBridge Sleep Rule
  LambdaEventBridgeSleepPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MCPServerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ProactiveSleepScheduleRule.Arn

Outputs:
  DynamoDBTable:
    Description: DynamoDB Single-Table Name
    Value: !Ref StudyBuddyTable
    Export:
      Name: !Sub "${ProjectName}-Table"

  APIEndpoint:
    Description: API Gateway V2 Streamable HTTP MCP Endpoint
    Value: !Sub "${StudyBuddyAPI.ApiEndpoint}"
    Export:
      Name: !Sub "${ProjectName}-API-Endpoint"

  CloudWatchDashboard:
    Description: CloudWatch Observability Dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}-Monitoring"
